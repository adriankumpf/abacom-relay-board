[package]
name = "arb"
version = "0.7.1"
authors = ["Adrian Kumpf"]
edition = '2024'

[dependencies]
clap = { version = "4.6.6", features = ["derive"], optional = true }
rusb = "0.9.4"
thiserror = "2.0.19"

[features]
build-binary = ["clap"]

[[bin]]
name = "arb"
required-features = ["build-binary"]
