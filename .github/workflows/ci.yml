name: CI

on:
  pull_request:
  push:
    branches:
      - "master"

# Superseded pull request runs are pointless; master runs are the ones worth
# having a complete history for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Cheapest first, so a formatting slip reports without waiting for a build.
      - run: cargo fmt --all --check

      - name: Install libusb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libusb-1.0-0-dev

      # Order matters: the dev-profile artifacts `cargo test` leaves behind
      # satisfy clippy's check-profile fingerprints, so clippy only has to lint
      # this crate rather than rebuild the dependency graph.
      - run: cargo test --locked --features=build-binary

      - run: cargo clippy --locked --features=build-binary --all-targets -- -D warnings

      # The crate is a library by default and only builds the CLI with
      # `build-binary`, so the default feature set needs linting of its own.
      - run: cargo clippy --locked --all-targets -- -D warnings
